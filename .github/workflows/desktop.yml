name: Application de bureau

# Construit l'application autonome (double-clic, sans Docker) pour Windows et macOS, puis la publie.
#
# - Publication automatique : quand le fichier VERSION change sur main (deploy/release.sh), le
#   workflow construit les installateurs et crée la version GitHub « vX.Y.Z » avec les fichiers
#   joints et les nouveautés du CHANGELOG.
# - Étiquette poussée (v1.2.0) : même chose, pour cette étiquette.
# - À la main (Actions > Application de bureau > Run workflow) : fichiers dans « Artifacts » ; avec
#   « tag », ils sont aussi joints à cette version existante.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version GitHub à laquelle joindre les installateurs (ex. v1.1.0). Vide : fichiers dans Artifacts seulement."
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]

# Nécessaire pour créer la version et y joindre les installateurs (Releases).
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt -r deploy/desktop/requirements.txt
      - run: python deploy/desktop/build.py
      - name: Installateur
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION).Trim()
          & "$env:ProgramFiles (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" deploy\desktop\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TMS-Vision-Windows
          path: dist/TMS-Vision-Setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: Apple-Silicon
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt -r deploy/desktop/requirements.txt
      - run: python deploy/desktop/build.py
      - name: Image disque
        run: |
          hdiutil create -volname "TMS Vision" -srcfolder "dist/TMS Vision.app" -ov -format UDZO "dist/TMS-Vision-Mac-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: TMS-Vision-Mac-${{ matrix.label }}
          path: dist/TMS-Vision-Mac-${{ matrix.label }}.dmg

  # Une seule publication, une fois tous les fichiers construits (pas de course entre les trois jobs).
  publish:
    needs: [windows, macos]
    # Pas de publication pour un lancement à la main sans « tag ».
    if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - name: Version et nouveautés
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(tr -d ' \r\n' < VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Nouveautés : la section « ## [X.Y.Z] » du CHANGELOG.
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Version ${TAG#v}." > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Version ${{ steps.release.outputs.tag }}
          body_path: notes.md
          files: installateurs/*
